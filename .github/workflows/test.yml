name: Run Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      REDIS_CLUSTER_URLS: redis://127.0.0.1:16379,redis://127.0.0.1:16380,redis://127.0.0.1:16381

    strategy:
      matrix:
        node-version: ['18.19.0', 20, 22, 24]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Start Redis Cluster
      run: scripts/test-cluster-env.sh up

    - name: Run tests
      run: npm test
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Stop Redis Cluster
      if: always()
      run: scripts/test-cluster-env.sh down
